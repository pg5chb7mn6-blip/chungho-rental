<style id="app-style">
/* Layout: one working column, a quote slip that reads like a service estimate; admin tab is a shared price sheet */
:root{
  --bg:#FDFCFB; --paper:#FFFFFF; --ink:#152030; --muted:#69798C; --line:#E4EBF3; --soft:#F4F8FE;
  --accent:#1E63D0; --accent-ink:#FFFFFF; --accent-soft:#EAF1FD;
  --warm:#96540A; --warm-soft:#FDEFD8; --ok:#0A6A5B; --ok-soft:#E3F3EF;
  --f-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Malgun Gothic",sans-serif;
  --f-num:"Pretendard Variable",Pretendard,ui-monospace,Menlo,Consolas,monospace;
  --sh-s:0 6px 18px -12px rgba(21,32,48,.28);--sh-m:0 18px 40px -26px rgba(21,32,48,.34)}
html{background:#FDFCFB}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:linear-gradient(168deg,#FDFCFB 0%,#F6F9FC 46%,#EAF1F9 100%) fixed;word-break:keep-all;-webkit-font-smoothing:antialiased;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
.wrap{max-width:860px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
header h1{font-size:1.6rem;line-height:1.3;margin:0 0 6px;font-weight:800;letter-spacing:-.045em;text-wrap:balance;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:.92rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:.92rem;font-weight:600;padding:10px 14px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
section.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-s);padding:20px;display:grid;gap:14px;min-width:0}
h2{font-size:1.02rem;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:.86rem;margin:-8px 0 0}
.svc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.svc button{font:inherit;text-align:left;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;display:grid;gap:4px}
.svc button b{font-size:1rem}
.svc button .num{font-size:1.15rem;font-weight:600}
.svc button small{color:var(--muted);font-size:.8rem;line-height:1.4}
.svc button{border-radius:14px}.svc button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
@media (max-width:560px){.svc{grid-template-columns:minmax(0,1fr)}}
input,select,textarea{font:inherit;font-size:.92rem;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
input.code{font-family:var(--f-num);text-transform:uppercase}
input.qty{text-align:center}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn.primary{border-radius:999px;box-shadow:0 6px 16px -8px rgba(30,99,208,.8);background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.prow{display:grid;grid-template-columns:170px 70px minmax(0,1fr) 110px 34px;gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0;padding-top:0}
.prow .info{font-size:.86rem;line-height:1.45;padding-top:4px;min-width:0}
.prow .info b{display:block;font-weight:600;overflow-wrap:anywhere}
.prow .info small{color:var(--muted);display:block;overflow-wrap:anywhere}
.prow .line{text-align:right;padding-top:8px;font-weight:600}
.cands{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cands button{font:inherit;font-family:var(--f-num);font-size:.78rem;padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--ink);cursor:pointer}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.chip.off{background:var(--warm-soft);color:var(--warm)}
.chip.man{background:var(--accent-soft);color:var(--accent)}
.chip.new{background:var(--ok-soft);color:var(--ok)}
.warn{color:var(--warm)}
@media (max-width:640px){.prow{grid-template-columns:minmax(0,1fr) 64px 34px;grid-template-areas:"code qty del" "info info info" "line line line"}
  .prow .c{grid-area:code}.prow .q{grid-area:qty}.prow .info{grid-area:info}.prow .line{grid-area:line;padding-top:0}.prow .x{grid-area:del}}
.slip{border:1px dashed var(--line);border-radius:10px;padding:16px;background:var(--bg);display:grid;gap:2px}
.slip .row{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.slip .row span:first-child{min-width:0;overflow-wrap:anywhere}
.slip .row.minor{color:var(--muted);font-size:.86rem;padding:1px 0 1px 12px}
.slip .row.sum{border-top:1px solid var(--ink);margin-top:8px;padding-top:10px;font-weight:700;font-size:1.15rem}
.slip .row.sum .num{color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{font-size:.85rem;color:var(--ok)}
.note{font-size:.84rem;color:var(--muted);margin:0}
.callout{background:var(--warm-soft);border-radius:8px;padding:10px 14px;font-size:.88rem}
.callout b{color:var(--warm)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:620px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.76rem;color:var(--muted);font-weight:600;letter-spacing:.03em;background:var(--soft);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.grid2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid2 label,.form label{display:grid;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form .wide{grid-column:1/-1}
@media (max-width:640px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.form{grid-template-columns:minmax(0,1fr)}}
.status{font-size:.8rem;color:var(--muted)}
footer{color:var(--muted);font-size:.78rem;text-align:center}
.topbar{position:sticky;top:0;z-index:70;background:rgba(253,252,251,.9);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid rgba(228,235,243,.9);margin:-24px calc(-1*max(16px,env(safe-area-inset-left,0px))) 22px}.topbar .in{max-width:860px;margin:0 auto;height:56px;display:flex;align-items:center;gap:9px;padding:0 16px}.topbar .mark{width:25px;height:25px;border-radius:9px;position:relative;background:linear-gradient(150deg,#1E63D0,#4A90E8);box-shadow:0 4px 10px -4px rgba(30,99,208,.6)}.topbar .mark::after{content:"";position:absolute;left:6px;right:6px;bottom:6px;height:7px;border-radius:4px;background:rgba(255,255,255,.9)}.topbar b{font-size:16px;font-weight:800;letter-spacing:-.04em}.topbar span{font-size:11px;color:var(--muted);font-weight:600;display:block;line-height:1.2}
.embed .topbar,.embed header{display:none}.embed body{padding-block:4px 20px;background:#fff!important}.embed html{background:#fff}.embed .wrap{gap:14px}.embed section.card{box-shadow:none}
</style>
<template id="shell">
<div class="wrap">
  <header>
    <h1>유베이스 유상서비스 요금 조회</h1>
    <p>상담 중 서비스 종류와 부품코드를 넣으면 고객에게 안내할 금액이 바로 계산됩니다.</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="화면">
    <button type="button" role="tab" id="tab-calc" aria-selected="true" data-view="calc">요금 계산</button>
    <button type="button" role="tab" id="tab-find" aria-selected="false" data-view="find">부품 단가 찾기</button>
    <button type="button" role="tab" id="tab-admin" aria-selected="false" data-view="admin" hidden>단가 관리</button>
  </nav>

  <!-- 요금 계산 -->
  <div id="view-calc" class="wrap" style="max-width:none">
    <section class="card" aria-labelledby="h-svc">
      <h2 id="h-svc">1. 서비스 종류</h2>
      <div class="svc" role="group" aria-label="서비스 종류">
        <button type="button" id="svc-repair" data-svc="repair" aria-pressed="true"><b>수리</b><span class="num" id="p-repair"></span><small>입고 · 점검 · 수리 후 설치 또는 폐기까지 고정 금액, 부품 교체 시 부품비 추가</small></button>
        <button type="button" id="svc-guide" data-svc="guide" aria-pressed="false"><b>사용설명</b><span class="num" id="p-guide"></span><small>방문 사용 안내, 부품비 없음</small></button>
        <button type="button" id="svc-ship" data-svc="ship" aria-pressed="false"><b>택배발송</b><span class="num" id="p-ship"></span><small>부품 택배 발송비 + 부품 실비</small></button>
      </div>
    </section>

    <section class="card" aria-labelledby="h-parts" id="partsCard">
      <h2 id="h-parts">2. 부품</h2>
      <p class="sub">부품코드는 영문·숫자만 입력하면 하이픈이 자동으로 들어갑니다 (예: 2012310 2271 → 201-2310-2271). 여러 개면 줄을 추가하고 수량을 바꾸세요.</p>
      <div id="parts"></div>
      <div class="actions"><button type="button" class="btn" id="addPart">+ 부품 추가</button><span class="note" id="dataNote"></span></div>
    </section>

    <section class="card" aria-labelledby="h-slip">
      <h2 id="h-slip">3. 고객 안내 금액</h2>
      <div class="slip" id="slip" aria-live="polite"></div>
      <div class="actions">
        <button type="button" class="btn primary" id="copy">안내 문자 복사</button>
        <button type="button" class="btn ghost" id="reset">새 상담</button>
        <span class="toast" id="toast"></span>
      </div>
      <textarea id="copyFallback" hidden readonly rows="8"></textarea>
      <p class="callout"><b>결제 안내</b> 결제는 문자로 보내드리는 카드결제 링크로만 받습니다. 계좌이체, 무통장입금, 현금은 받지 않습니다.</p>
    </section>
  </div>

  <!-- 부품 단가 찾기 -->
  <section class="card" id="view-find" hidden aria-labelledby="h-find">
    <h2 id="h-find">부품 단가 찾기</h2>
    <p class="sub">부품코드 일부, 영문 부품명, 모델명으로 찾을 수 있습니다. 최대 60개까지 보여 줍니다.</p>
    <input id="findQ" placeholder="예: T30, main board, 201-2310" autocomplete="off">
    <p class="status" id="findCount"></p>
    <div class="tbl"><table><thead><tr><th>부품코드</th><th>부품명</th><th>적용 모델</th><th class="r">원화 단가</th><th></th></tr></thead><tbody id="findBody"></tbody></table></div>
  </section>

  <!-- 단가 관리 -->
  <div id="view-admin" class="wrap" style="max-width:none" hidden>
    <section class="card" aria-labelledby="h-fees">
      <h2 id="h-fees">서비스 요금 · 환율</h2>
      <p class="sub">저장하면 이 툴을 쓰는 모든 사람에게 바로 반영됩니다.</p>
      <div class="grid2">
        <label for="fee-repair">수리 (원)<input id="fee-repair" class="num" inputmode="numeric"></label>
        <label for="fee-guide">사용설명 (원)<input id="fee-guide" class="num" inputmode="numeric"></label>
        <label for="fee-ship">택배발송 (원)<input id="fee-ship" class="num" inputmode="numeric"></label>
        <label for="fee-rate">적용 환율 (원/USD)<input id="fee-rate" class="num" inputmode="numeric"></label>
      </div>
      <div class="actions"><button type="button" class="btn primary" id="saveFees">요금 저장</button><span class="status" id="feesStatus"></span></div>
      <p class="note">부품 원화 단가 = 에코백스 USD 단가 × 적용 환율, 100원 단위 올림. 직접 지정한 부품은 환율과 관계없이 지정 금액을 씁니다.</p>
    </section>

    <section class="card" aria-labelledby="h-edit">
      <h2 id="h-edit">부품 단가 수정 · 추가</h2>
      <p class="sub">코드를 넣고 불러오면 현재 값이 채워집니다. 목록에 없는 코드는 새 부품으로 추가됩니다.</p>
      <div class="actions" style="flex-wrap:nowrap"><input id="ed-code" class="code" placeholder="201-2310-2271" maxlength="13" autocomplete="off" autocapitalize="characters" spellcheck="false"><button type="button" class="btn" id="ed-load">불러오기</button></div>
      <p class="status" id="ed-base"></p>
      <div class="form">
        <label for="ed-name">부품명<input id="ed-name"></label>
        <label for="ed-model">적용 모델<input id="ed-model"></label>
        <label for="ed-krw">원화 단가 직접 지정 (비우면 환율 자동)<input id="ed-krw" class="num" inputmode="numeric" placeholder="자동"></label>
        <label for="ed-active">상태<select id="ed-active"><option value="1">판매중</option><option value="0">단종</option></select></label>
        <label for="ed-note" class="wide">메모 (변경 사유)<input id="ed-note" placeholder="예: 11월 단가 인상 반영"></label>
      </div>
      <div class="actions"><button type="button" class="btn primary" id="ed-save">저장</button><button type="button" class="btn" id="ed-revert" hidden>원래 단가로 되돌리기</button><span class="status" id="ed-status"></span></div>
    </section>

    <section class="card" aria-labelledby="h-log">
      <h2 id="h-log">변경한 부품</h2>
      <p class="sub">기본 단가표와 다르게 관리 중인 부품입니다. 최근 변경 순.</p>
      <div class="tbl"><table><thead><tr><th>부품코드</th><th>부품명</th><th class="r">원화 단가</th><th>상태</th><th>메모</th><th>변경</th></tr></thead><tbody id="logBody"></tbody></table></div>
      <p class="note">저장하면 툴이 새 버전으로 바뀌고, 열려 있는 모든 화면이 최신 내용으로 다시 불러옵니다. 링크는 그대로입니다.</p>
    </section>
  </div>

  <footer id="foot"></footer>
</div>
</template>

  lines.push(`합계: ${won(q.total)}`, '※ 결제는 문자로 보내드리는 카드결제 링크로만 가능합니다.');
  const t = lines.join('\n'), fb = $('copyFallback'), toast = $('toast');
  const done = () => { toast.textContent = '복사했습니다. 문자에 붙여넣으세요.'; setTimeout(() => toast.textContent = '', 3000); };
  const fail = () => { fb.value = t; fb.hidden = false; fb.focus(); fb.select(); toast.textContent = '아래 내용을 선택해 복사하세요.'; };
  try { navigator.clipboard.writeText(t).then(done, fail); } catch (e) { fail(); }
});

/* ---------- 부품 단가 찾기 ---------- */
function renderFind() {
  const q = $('findQ').value.trim(), Q = raw(q), ql = q.toLowerCase();
  if (q.length < 2) { $('findBody').innerHTML = ''; $('findCount').textContent = `디봇 부품 ${ALL().length.toLocaleString('ko-KR')}종. 두 글자 이상 입력하세요.`; return; }
  const hits = [];
  for (const k of ALL()) { const p = part(k); if (!p) continue;
    if ((Q.length >= 3 && k.replace(/-/g, '').includes(Q)) || p.name.toLowerCase().includes(ql) || p.model.toLowerCase().includes(ql)) { hits.push(p); if (hits.length >= 60) break; } }
  $('findCount').textContent = hits.length >= 60 ? '60개 이상 찾았습니다. 더 구체적으로 입력하세요.' : `${hits.length}개 찾았습니다.`;
  $('findBody').innerHTML = hits.map(p => `<tr><td class="num">${esc(p.code)}</td><td>${esc(p.name)}${p.active ? '' : '<span class="chip off">단종</span>'}${p.manual ? '<span class="chip man">지정 단가</span>' : ''}</td><td>${esc(p.model)}</td><td class="r num">${won(p.krw)}</td><td><button type="button" class="btn" data-use="${esc(p.code)}">계산에 넣기</button></td></tr>`).join('');
}
$('findQ').addEventListener('input', renderFind);
$('findBody').addEventListener('click', e => {
  const b = e.target.closest('[data-use]'); if (!b) return;
  const empty = rows.findIndex(r => !norm(r.code));
  if (empty >= 0) rows[empty].code = b.dataset.use; else rows.push({ code: b.dataset.use, qty: 1 });
  if (svc === 'guide') setSvc('repair');
  renderRows(); renderSlip(); show('calc');
});

/* ---------- 탭 ---------- */
function show(v) {
  ['calc', 'find', 'admin'].forEach(k => { $('view-' + k).hidden = k !== v; $('tab-' + k).setAttribute('aria-selected', String(k === v)); });
  if (v === 'find') renderFind(); if (v === 'admin') renderAdmin();
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => show(b.dataset.view)));

/* ---------- 단가 관리 ---------- */
const fmtTime = t => { try { return new Date(t).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
function fillFees() { $('fee-repair').value = cfg.repair.toLocaleString('ko-KR'); $('fee-guide').value = cfg.guide.toLocaleString('ko-KR'); $('fee-ship').value = cfg.ship.toLocaleString('ko-KR'); $('fee-rate').value = cfg.rate.toLocaleString('ko-KR'); }
['fee-repair', 'fee-guide', 'fee-ship', 'fee-rate', 'ed-krw'].forEach(id => $(id).addEventListener('input', e => { const v = intOf(e.target.value); e.target.value = v ? v.toLocaleString('ko-KR') : ''; }));
async function renderAdmin() {
  if (!canEdit) return;
  if (document.activeElement && !document.activeElement.id.startsWith('fee-')) fillFees();
  const list = Object.entries(ov).sort((a, b) => String(b[1].updatedAt || '').localeCompare(String(a[1].updatedAt || '')));
  $('feesStatus').textContent = cfgMeta && cfgMeta.updatedAt ? `마지막 저장: ${fmtTime(cfgMeta.updatedAt)}` : '아직 저장한 적 없음 (기본값 사용 중)';
  $('logBody').innerHTML = list.length ? list.map(([code, o]) => { const p = part(code);
    return `<tr><td class="num">${esc(code)}</td><td>${esc(p ? p.name : '')}${p && p.added ? '<span class="chip new">추가</span>' : ''}</td><td class="r num">${p ? won(p.krw) : '-'}${o.krw > 0 ? '' : '<br><small style="color:var(--muted)">환율 자동</small>'}</td><td>${p && p.active ? '판매중' : '단종'}</td><td>${esc(o.note || '')}</td><td><small>${esc(fmtTime(o.updatedAt))}</small><br><button type="button" class="btn ghost" data-edit="${esc(code)}">수정</button></td></tr>`; }).join('')
    : '<tr><td colspan="6" style="color:var(--muted)">아직 변경한 부품이 없습니다. 위에서 부품코드를 불러와 단가를 바꾸면 여기에 쌓입니다.</td></tr>';
}
function loadEditor(code) {
  const c = norm(code); $('ed-code').value = c; $('ed-status').textContent = '';
  if (!CODE_RE.test(c)) { $('ed-base').textContent = '부품코드 11자리(영문·숫자)를 모두 입력하세요. 예: 201-2310-2271'; return false; }
  const b = BASE.p[c], o = ov[c] || {}, p = part(c);
  $('ed-base').textContent = b ? `기본 단가표: ${b[0]} · USD ${b[2]} → 환율 적용 ${won(fromUsd(b[2]))}` : '기본 단가표에 없는 코드입니다. 저장하면 새 부품으로 추가됩니다 (원화 단가 필수).';
  $('ed-name').value = p ? p.name : ''; $('ed-model').value = p ? p.model : '';
  $('ed-krw').value = o.krw > 0 ? o.krw.toLocaleString('ko-KR') : '';
  $('ed-active').value = p && !p.active ? '0' : '1'; $('ed-note').value = o.note || '';
  $('ed-revert').hidden = !ov[c];
  return true;
}
$('ed-load').addEventListener('click', () => loadEditor($('ed-code').value));
$('ed-code').addEventListener('input', e => fmtInput(e.target));
$('ed-code').addEventListener('keydown', e => { if (e.key === 'Enter') loadEditor($('ed-code').value); });
$('logBody').addEventListener('click', e => { const b = e.target.closest('[data-edit]'); if (b) { loadEditor(b.dataset.edit); $('ed-code').scrollIntoView({ block: 'center' }); } });
$('saveFees').addEventListener('click', async () => {
  const next = { repair: intOf($('fee-repair').value), guide: intOf($('fee-guide').value), ship: intOf($('fee-ship').value), rate: intOf($('fee-rate').value) };
  if (!next.repair || !next.guide || !next.ship || next.rate < 500) { $('feesStatus').textContent = '금액과 환율을 모두 입력하세요. 환율은 500 이상이어야 합니다.'; return; }
  $('feesStatus').textContent = '저장 중…';
  await save({ cfg: { ...next, updatedAt: new Date().toISOString() }, ov }, $('feesStatus'));
});
$('ed-save').addEventListener('click', async () => {
  const c = norm($('ed-code').value); if (!loadEditorCheck(c)) return;
  const krw = intOf($('ed-krw').value);
  if (!BASE.p[c] && !krw) { $('ed-status').textContent = '새 부품은 원화 단가를 입력해야 합니다.'; return; }
  if (!$('ed-name').value.trim()) { $('ed-status').textContent = '부품명을 입력하세요.'; return; }
  const body = { name: $('ed-name').value.trim(), model: $('ed-model').value.trim(), krw: krw ? Math.ceil(krw / UNIT) * UNIT : 0, active: $('ed-active').value === '1' ? 1 : 0, note: $('ed-note').value.trim(), updatedAt: new Date().toISOString() };
  $('ed-status').textContent = '저장 중…';
  await save({ cfg: cfgMeta || {}, ov: { ...ov, [c]: body } }, $('ed-status'));
});
function loadEditorCheck(c) { if (!CODE_RE.test(c)) { $('ed-status').textContent = '부품코드를 확인하세요.'; return false; } return true; }
let revertArmed = false;
$('ed-revert').addEventListener('click', async () => {
  const c = norm($('ed-code').value); if (!ov[c]) return;
  if (!revertArmed) { revertArmed = true; $('ed-revert').textContent = '한 번 더 누르면 되돌립니다'; setTimeout(() => { revertArmed = false; $('ed-revert').textContent = '원래 단가로 되돌리기'; }, 4000); return; }
  revertArmed = false; $('ed-revert').textContent = '원래 단가로 되돌리기';
  const next = { ...ov }; delete next[c];
  await save({ cfg: cfgMeta || {}, ov: next }, $('ed-status'));
});
/* ---------- 저장: 툴 자체를 새 버전으로 다시 게시 ---------- */
const RESET = ':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
const FONT_HREF = 'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap';
function buildDoc(state) {
  const safe = t => t.replace(/</g, '\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>'
    + '<title>' + esc(document.title || '유베이스 유상서비스 요금 조회') + '</title>\n\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="' + FONT_HREF + '">\n'
    + '<style id="app-style">' + document.getElementById('app-style').textContent + '</style>\n'
    + '<template id="shell">' + document.getElementById('shell').innerHTML + '</template>\n<div id="root"></div>\n'
    + '<script type="application/json" id="base">' + document.getElementById('base').textContent + '<\/script>\n'
    + '<script type="application/json" id="state">' + safe(JSON.stringify(state)) + '<\/script>\n'
    + '<script id="app">' + document.getElementById('app').textContent + '<\/script>\n</body></html>';
}
let saving = false;
async function save(state, statusEl) {
  if (saving) return; saving = true;
  if (!art) { statusEl.textContent = '이 화면에서는 저장할 수 없습니다. claude.ai에서 툴을 열어 주세요.'; saving = false; return; }
  statusEl.textContent = '저장 중… 잠시 후 최신 내용으로 다시 불러옵니다.';
  try { await art.publish(buildDoc(state)); statusEl.textContent = '저장했습니다. 모두에게 반영됩니다.'; }
  catch (e) {
    const c = e && e.code;
    statusEl.textContent = c === 'conflict' ? '다른 관리자가 먼저 저장했습니다. 최신 내용으로 다시 불러오니 한 번 더 수정해 주세요.'
      : (c === 'not_writer' || c === 'not_granted' || c === 'not_declared' || c === 'consent_required') ? '편집 권한이 없어 저장할 수 없습니다. 조회만 가능합니다.'
      : c === 'rate_limited' ? '저장이 너무 잦습니다. 잠시 후 다시 저장하세요.' : '저장하지 못했습니다. 잠시 후 다시 시도하세요.';
    if (c === 'not_writer' || c === 'not_granted') { canEdit = false; $('tab-admin').hidden = true; }
  }
  saving = false;
}

/* ---------- 시작 ---------- */
function refreshAll() { renderFees(); rows.forEach((_, i) => $('pi-' + i) && updateRow(i)); renderSlip(); if (!$('view-find').hidden) renderFind(); if (!$('view-admin').hidden) renderAdmin(); }
$('foot').textContent = `기본 단가: 에코백스 Spare Part Number Basic List (2026년 5월) · 디봇 부품 ${Object.keys(BASE.p).length.toLocaleString('ko-KR')}종`;
renderFees(); renderRows(); setSvc('repair');

$('dataNote').textContent = cfgMeta && cfgMeta.updatedAt ? `최신 단가 반영 · ${fmtTime(cfgMeta.updatedAt)} 저장본` : '기본 단가표 기준';
(async () => {
  if (!window.claude || !claude.use) return;
  const [a, user] = await Promise.all([claude.use('artifact'), claude.use('user')]);
  art = a;
  try { canEdit = user ? await user.canEdit() : false; } catch (e) { canEdit = false; }
  if (canEdit && art) { $('tab-admin').hidden = false; fillFees(); }
})();

})();
</script>

</body>
</html>
